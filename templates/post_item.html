{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h1>Add an Item</h1>
    <form method="POST" action="{{ url_for('post_item') }}" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">Item Name</label>
            <input type="text" id="title" name="title" class="form-control" required>
        </div>
        <div class="form-group mt-3">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="4" required></textarea>
        </div>
        <div class="form-group mt-3">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control" required>
                <option value="Electronics">Electronics</option>
                <option value="Furniture">Furniture</option>
                <option value="Clothing">Clothing</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="form-group mt-3">
            <label for="price">Price (in rubles, if applicable)</label>
            <input type="number" id="price" name="price" class="form-control">
        </div>
        <div class="form-group mt-3">
            <label for="image">Main Image (required)</label>
            <input type="file" id="image" name="image" class="form-control" accept="image/*" required>
        </div>
        <!-- Field for additional images -->
        <div class="form-group mt-3">
            <label for="images">Additional Images (optional)</label>
            <input type="file" id="images" name="images" class="form-control" accept="image/*" multiple>
        </div>
        <button type="submit" class="btn btn-primary mt-4">Post</button>
    </form>
</div>
{% endblock %}
